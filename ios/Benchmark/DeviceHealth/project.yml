name: OpenWeightsDeviceHealth
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: DK95L4JCWY
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_TESTABILITY: YES
    SWIFT_OPTIMIZATION_LEVEL: -O
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  OpenWeightsDeviceHealth:
    type: application
    platform: iOS
    sources: [App.swift]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: OpenWeights Device Check
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.experimentalmachines.openweights.benchmark
  DeviceHealthTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests.swift, StorageSnapshot.swift]
    dependencies:
      - target: OpenWeightsDeviceHealth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.experimentalmachines.openweights.benchmark.tests
schemes:
  DeviceHealth:
    build:
      targets:
        OpenWeightsDeviceHealth: all
        DeviceHealthTests: [test]
    test:
      config: Release
      targets: [DeviceHealthTests]
      gatherCoverageData: false
