name: OpenWeightsBench
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.4
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.3
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.0
  ExecuTorch:
    url: https://github.com/pytorch/executorch
    revision: a4e0fe851341665f0a8af56651d6eca870a856fa
settings:
  base:
    OW_NATIVE_BUILD: .build/native
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: DK95L4JCWY
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    ENABLE_TESTABILITY: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_OPTIMIZATION_LEVEL: -O
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  OpenWeightsBench:
    type: application
    platform: iOS
    sources:
      - App
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.experimentalmachines.openweights.benchmark
        SWIFT_OBJC_BRIDGING_HEADER: Native/Benchmark-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Native
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/$(OW_NATIVE_BUILD)/**
        OTHER_LDFLAGS: -ObjC -force_load "$(BUILT_PRODUCTS_DIR)/libexecutorch_ios.a" -force_load "$(SRCROOT)/$(OW_NATIVE_BUILD)/libow_regex_lookahead.a" -lpcre2-8 -force_load "$(BUILT_PRODUCTS_DIR)/libkernels_torchao_ios.a" -force_load "$(BUILT_PRODUCTS_DIR)/libkernels_quantized_ios.a" -force_load "$(BUILT_PRODUCTS_DIR)/libkernels_optimized_ios.a" -force_load "$(BUILT_PRODUCTS_DIR)/libkernels_llm_ios.a" -force_load "$(BUILT_PRODUCTS_DIR)/libbackend_xnnpack_ios.a" -lopenweights_apple -lllama-common -lllama-common-base -lvendor-hash -lmtmd -lllama -lggml -lggml-base -lggml-cpu -lggml-metal -lggml-blas -lcpp-httplib -lc++ -framework Accelerate -framework Metal -framework MetalKit
    info:
      path: .build/Info.plist
      properties:
        CFBundleDisplayName: OpenWeights Bench
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        UIFileSharingEnabled: YES
        LSSupportsOpeningDocumentsInPlace: YES
        UIApplicationSupportsIndirectInputEvents: YES
    dependencies:
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: Transformers
        product: Tokenizers
      - package: ExecuTorch
        product: executorch_llm
      - package: ExecuTorch
        product: backend_xnnpack
      - package: ExecuTorch
        product: kernels_llm
      - package: ExecuTorch
        product: kernels_optimized
      - package: ExecuTorch
        product: kernels_quantized
      - package: ExecuTorch
        product: kernels_torchao
  BenchmarkTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: OpenWeightsBench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.experimentalmachines.openweights.benchmark.tests
schemes:
  OpenWeightsBench:
    build:
      targets:
        OpenWeightsBench: all
        BenchmarkTests: [test]
    test:
      config: Release
      targets: [BenchmarkTests]
      gatherCoverageData: false
    run:
      config: Release
